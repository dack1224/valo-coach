<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VALO COACH ADMIN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f4f7fb;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{font-size:25px;font-weight:950}.brand b{color:#ff4655}.muted{color:#8f9aaa;font-size:12px}.card{background:#111720;border:1px solid #27313e;border-radius:17px;padding:18px;margin-top:16px}.login{max-width:440px;margin:80px auto}.row{display:grid;grid-template-columns:1.3fr .7fr .7fr 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #252d39}.btn{border:0;border-radius:10px;padding:9px 12px;background:#293240;color:#fff;font-weight:850;cursor:pointer}.red{background:#ff4655}.green{background:#238758}.btn:disabled{opacity:.45;cursor:not-allowed}input{width:100%;margin:6px 0;background:#0b1017;color:#fff;border:1px solid #303b49;border-radius:10px;padding:11px}.tag{font-size:11px;padding:5px 8px;border:1px solid #3a4655;border-radius:999px}.pending{color:#f3c969}.active{color:#65dc9a}.err{color:#ff7a84}.ok{color:#65dc9a}@media(max-width:760px){.row{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="app"></div><script>
const SUPABASE_URL='https://yndufztghtkltzssqwif.supabase.co';
const SUPABASE_KEY='sb_publishable_tn4049MkaJJK1OyVuosZ8g_fsqQN4y4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function loginView(msg=''){app.innerHTML=`<div class="wrap"><div class="card login"><div class="brand">VALO <b>COACH</b> ADMIN</div><p class="muted">관리자 계정으로 로그인하세요.</p><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button class="btn red" style="width:100%;margin-top:8px" onclick="login()">로그인</button><p id="msg" class="muted">${esc(msg)}</p></div></div>`}
async function login(){msg.textContent='로그인 중...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error){msg.className='err';msg.textContent=error.message;return}await boot()}
async function logout(){await sb.auth.signOut();me=null;profile=null;loginView('로그아웃했습니다.')}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){loginView();return}me=user;const {data,error}=await sb.from('profiles').select('id,nickname,role').eq('id',user.id).single();if(error||!data){loginView('프로필을 불러오지 못했습니다.');return}profile=data;if(profile.role!=='admin'){await sb.auth.signOut();loginView('이 계정은 관리자 권한이 없습니다.');return}shell();await refresh()}
function shell(){app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">VALO <b>COACH</b> ADMIN</div><div class="muted">${esc(profile.nickname||me.email)} · 서버 관리자 인증</div></div><div><button class="btn" onclick="refresh()">새로고침</button> <button class="btn" onclick="logout()">로그아웃</button></div></div><div class="card"><b>요금제</b><p class="muted">월간 ₩1,000 → 30일 · 연간 ₩10,000 → 365일. 승인 작업은 DB 관리자 함수로만 처리됩니다.</p><div id="status" class="muted"></div></div><div class="card"><h2>인증 대기</h2><div id="pending"></div></div><div class="card"><h2>활성 PRO 사용자</h2><div id="active"></div></div></div>`}
async function refresh(){status.textContent='불러오는 중...';const [{data:reqs,error:e1},{data:subs,error:e2},{data:profiles,error:e3}]=await Promise.all([sb.from('pro_requests').select('*').eq('status','pending').order('requested_at',{ascending:true}),sb.from('subscriptions').select('*').eq('status','active').order('expires_at',{ascending:true}),sb.from('profiles').select('id,nickname')]);if(e1||e2||e3){status.className='err';status.textContent=(e1||e2||e3).message;return}const names=Object.fromEntries((profiles||[]).map(x=>[x.id,x.nickname||'닉네임 없음']));pending.innerHTML=reqs?.length?reqs.map(x=>`<div class="row"><div><b>${esc(names[x.user_id])}</b><br><span class="muted">${esc(x.user_id)}</span></div><div>${x.plan==='yearly'?'연간':'월간'}<br><span class="muted">₩${Number(x.amount).toLocaleString()}</span></div><div class="pending">대기</div><div class="muted">${new Date(x.requested_at).toLocaleString('ko-KR')}</div><div><button class="btn green" onclick="approve(${x.id})">승인</button> <button class="btn" onclick="rejectReq(${x.id})">거절</button></div></div>`).join(''):'<p class="muted">대기 중인 신청이 없습니다.</p>';active.innerHTML=subs?.length?subs.map(x=>`<div class="row"><div><b>${esc(names[x.user_id])}</b><br><span class="muted">${esc(x.user_id)}</span></div><div>${x.plan==='yearly'?'연간':'월간'}</div><div class="active">PRO 활성</div><div><b>${x.expires_at?new Date(x.expires_at).toLocaleDateString('ko-KR'):'-'}</b><br><span class="muted">만료</span></div><div><button class="btn" onclick="extendSub('${x.user_id}',30)">+30일</button> <button class="btn" onclick="extendSub('${x.user_id}',365)">+1년</button> <button class="btn red" onclick="revokeSub('${x.user_id}')">해제</button></div></div>`).join(''):'<p class="muted">활성 PRO 사용자가 없습니다.</p>';status.className='ok';status.textContent=`대기 ${reqs?.length||0}건 · 활성 PRO ${subs?.length||0}명`}
async function rpc(name,args){status.className='muted';status.textContent='처리 중...';const {error}=await sb.rpc(name,args);if(error){status.className='err';status.textContent=error.message;alert(error.message);return false}await refresh();return true}
async function approve(id){if(confirm('이 신청을 승인하고 PRO를 활성화할까요?'))await rpc('admin_approve_pro',{request_id:id})}
async function rejectReq(id){if(confirm('이 신청을 거절할까요?'))await rpc('admin_reject_pro',{request_id:id})}
async function extendSub(uid,days){if(confirm(`${days}일 연장할까요?`))await rpc(days===30?'admin_extend_30':'admin_extend_year',{target_user:uid})}
async function revokeSub(uid){if(confirm('이 사용자의 PRO를 해제할까요?'))await rpc('admin_disable_pro',{target_user:uid})}
sb.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
